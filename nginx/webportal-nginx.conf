server {
    listen 8080 default_server;

    port_in_redirect off;

    rewrite ^/([^/]+)/select /solr/$1/select;

    location ~ ^/solr/([^/]+)/select {
      proxy_pass http://localhost:8983;
    }

    location / {
      root /home/specify/webportal-installer/build/html;
    }

    location /custom-images/ {
      alias /home/specify/custom-images/;
    }

    location /fileget {
      resolver 10.10.10.10;
      proxy_pass         http://ummz.specify.lsa.umich.edu;
      proxy_redirect     off;
      proxy_set_header user-agent "Mozilla/5.0 (Linux; Android 6.0; Nexus 5 Build/MRA58N) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/102.0.0.0 Mobile Safari/537.36";
    }

    location /attachment-images/ {
      proxy_pass http://ummz.specify.lsa.umich.edu/fileget?coll=Fish&type=T&filename=sp61838052618960971310.att.jpg&scale=200;
    }
}
